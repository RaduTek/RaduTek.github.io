<article class="post-list card">
    <h3 class="post-title">
        <a class="post-link" href="{{ include.post.url | relative_url }}">
            {{ include.post.title | escape }}
        </a>
    </h3>
    {%- if site.show_excerpts -%}
    {{ include.post.excerpt }}
    {%- endif -%}
    <p class="post-meta">
        Posted on <span>{{ include.post.date | date: "%b %-d, %Y" }}</span>
        <a href="{{ include.post.url | relative_url }}" class="post-more float-right">Read more &rarr;</a>
    </p>
</article>
